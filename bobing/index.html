<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>月下博饼 · 好友联机</title>
  <meta name="description" content="零成本、免注册，和微信好友轮流掷骰子玩闽南博饼。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%239e2424'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%23fff4d6'/%3E%3Ccircle cx='25' cy='25' r='3.5' fill='%239e2424'/%3E%3Ccircle cx='39' cy='39' r='3.5' fill='%239e2424'/%3E%3C/svg%3E">
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root{--red:#9e2424;--deep:#3b1715;--gold:#e7b85d;--paper:#fff4d6;--ink:#321b17;--muted:#7c6259;--green:#2e7259}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#d55b42 0,#9d2925 32%,#421718 100%);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(1080px,100%);margin:auto;padding:18px}.topbar{display:flex;align-items:center;justify-content:space-between;color:#fff3d6;margin-bottom:14px}.brand{font-family:serif;font-weight:800;font-size:1.35rem;letter-spacing:.08em}.status{font-size:.88rem;opacity:.86}.card{background:linear-gradient(150deg,#fff9e8,#f4dfb4);border:1px solid rgba(255,255,255,.35);border-radius:24px;box-shadow:0 20px 60px rgba(35,8,8,.32)}.start{max-width:520px;margin:8vh auto 0;padding:32px}.start h1{font:800 2.2rem/1.15 serif;margin:0 0 10px;color:var(--deep)}.start p{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700}.field input{width:100%;border:1px solid #d6bb84;border-radius:12px;background:#fffdf7;padding:13px 14px;font-size:1rem;outline:none}.field input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(158,36,36,.12)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:12px;padding:13px 16px;font:700 1rem inherit;cursor:pointer;transition:.18s transform,.18s opacity}button:active{transform:scale(.98)}.primary{background:var(--red);color:#fff8e8}.secondary{background:#ead6aa;color:var(--deep)}button:disabled{opacity:.42;cursor:not-allowed}.note{font-size:.83rem;color:var(--muted);margin-top:16px}.game{display:none;grid-template-columns:280px 1fr;gap:16px}.side{padding:20px}.roomline{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid #d9c28e}.code{font:800 1.15rem/1 monospace;color:var(--red)}.tiny{padding:8px 10px;font-size:.82rem}.players{display:grid;gap:9px;margin-top:15px}.player{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px}.player.active{background:#eed29a}.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--red);color:white;font-weight:800}.pname{font-weight:700}.you{font-size:.75rem;color:var(--muted)}.main{padding:22px;min-height:650px;display:grid;grid-template-rows:auto 1fr auto}.turn{text-align:center}.turn h2{font:800 1.45rem/1.3 serif;margin:0}.turn p{margin:5px;color:var(--muted)}.bowl{align-self:center;justify-self:center;width:min(440px,92vw);aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:50%;background:radial-gradient(circle,#fffdf5 0 52%,#d8b363 53% 58%,#f7e9c2 59% 69%,#9c2722 70% 73%,#f1c86e 74%);box-shadow:inset 0 -18px 30px rgba(85,35,15,.2),0 16px 30px rgba(74,26,14,.2)}.dicegrid{width:64%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.die{aspect-ratio:1;border-radius:15px;background:#fff;box-shadow:0 5px 8px rgba(50,20,10,.25);display:grid;place-items:center;font-size:2rem;font-weight:900;color:var(--red)}.rolling .die{animation:shake .16s infinite alternate}@keyframes shake{to{transform:translate(3px,-3px) rotate(5deg)}}.result{text-align:center;font:800 1.2rem serif;color:var(--red);min-height:2rem}.rollwrap{text-align:center}.roll{min-width:190px;background:var(--red);color:white;font-size:1.1rem;box-shadow:0 7px 0 #671819}.history{grid-column:1/-1;background:rgba(255,249,232,.94);border-radius:20px;padding:16px 18px;color:var(--ink)}.history h3{margin:0 0 9px;font:800 1.05rem serif}.log{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.logitem{flex:0 0 auto;background:#fff;border:1px solid #ead9b6;border-radius:10px;padding:8px 10px;font-size:.85rem}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#281513;color:#fff;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%)}
    .prize-config{margin:18px 0 4px;padding:14px;background:rgba(255,255,255,.42);border-radius:15px}.prize-config summary{font-weight:800;cursor:pointer}.config-grid{display:grid;gap:9px;margin-top:12px}.config-row{display:grid;grid-template-columns:56px 74px 1fr;align-items:end;gap:8px;padding:9px;background:rgba(255,255,255,.46);border-radius:11px}.config-name{font-weight:800;align-self:center;color:var(--deep)}.config-cell{display:grid;gap:3px;font-size:.75rem;color:var(--muted)}.config-cell input{min-width:0;width:100%;border:1px solid #d6bb84;border-radius:8px;padding:8px;background:#fffdf7;font:600 .9rem inherit;color:var(--ink)}.prize-board{margin-top:18px;padding-top:14px;border-top:1px solid #d9c28e}.prize-board h3,.panel-title{margin:0 0 9px;font:800 1.05rem serif}.prizes{display:grid;grid-template-columns:1fr;gap:7px}.prize{display:grid;grid-template-columns:auto 28px;gap:2px 8px;background:rgba(255,255,255,.5);border-radius:9px;padding:7px 9px;font-size:.84rem}.prize b{color:var(--red);text-align:right}.prize small{grid-column:1/-1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prize.empty{opacity:.48}.gameover{color:var(--red)!important;font-weight:800}.awards-panel{grid-column:1/-1;background:rgba(255,249,232,.94);border-radius:20px;padding:16px 18px;color:var(--ink)}.award-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.award-person{background:#fff;border:1px solid #ead9b6;border-radius:13px;padding:12px}.award-person-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.award-person-head b{font-family:serif}.offline{font-size:.75rem;color:var(--muted)}.win-chips{display:flex;flex-wrap:wrap;gap:6px}.win-chip{background:#f5e4bb;color:var(--deep);border-radius:999px;padding:4px 8px;font-size:.8rem}.ceremony{display:none;grid-column:1/-1;background:linear-gradient(135deg,#6f1719,#a82a24);color:#fff5d8;border:1px solid #e7b85d;border-radius:22px;padding:22px}.ceremony.show{display:block}.ceremony h2{margin:0 0 4px;font:800 1.5rem serif}.ceremony>p{margin:0 0 16px;opacity:.8}.ceremony-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.ceremony-person{background:rgba(255,255,255,.1);border:1px solid rgba(255,235,177,.28);border-radius:13px;padding:13px}.ceremony-person h3{margin:0 0 8px;font:800 1.05rem serif}.ceremony-person ul{margin:0;padding-left:19px}.ceremony-person .none{opacity:.7;font-size:.9rem}
    .resume-box{display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;padding:12px 14px;border:1px solid #d3a54d;border-radius:13px;background:#fff3cf}.resume-box.show{display:flex}.resume-copy{display:grid;gap:2px}.resume-copy b{color:var(--red)}.resume-copy span{font-size:.82rem;color:var(--muted)}
    @media(max-width:760px){.shell{padding:12px}.game{grid-template-columns:1fr}.side{padding:14px}.players{display:flex;overflow-x:auto}.player{min-width:max-content}.main{min-height:540px;padding:16px}.bowl{width:min(360px,88vw)}.history,.awards-panel,.ceremony{grid-column:auto}.start{margin-top:3vh;padding:24px}.actions{grid-template-columns:1fr}.prize-board{margin-top:12px}.prizes{grid-template-columns:repeat(2,1fr)}.config-row{grid-template-columns:50px 68px 1fr}.award-board{grid-template-columns:1fr}.ceremony-list{grid-template-columns:1fr}.resume-box{align-items:stretch;flex-direction:column}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand">月下博饼</div><div id="netStatus" class="status">准备开局</div></header>
    <section id="start" class="card start">
      <h1>摇一碗中秋好运</h1><p>免注册、不开麦，只和朋友轮流掷骰子。</p>
      <div id="resumeBox" class="resume-box"><div class="resume-copy"><b>发现上一局</b><span id="resumeText"></span></div><button id="resumeBtn" class="primary tiny">返回对局</button></div>
      <div class="field"><label for="name">你的称呼</label><input id="name" maxlength="12" placeholder="例如：阿明" autocomplete="nickname"></div>
      <div id="joinField" class="field" style="display:none"><label for="room">房间号</label><input id="room" maxlength="16" placeholder="打开邀请链接会自动填写"></div>
      <details id="prizeConfig" class="prize-config" open><summary>设置本局奖项</summary><div class="config-grid">
        <div class="config-row"><span class="config-name">一秀</span><label class="config-cell">数量<input data-count="一秀" type="number" min="0" max="999" value="32"></label><label class="config-cell">金额或奖品<input data-reward="一秀" maxlength="30" placeholder="如：5 元红包"></label></div>
        <div class="config-row"><span class="config-name">二举</span><label class="config-cell">数量<input data-count="二举" type="number" min="0" max="999" value="16"></label><label class="config-cell">金额或奖品<input data-reward="二举" maxlength="30" placeholder="如：饮料一瓶"></label></div>
        <div class="config-row"><span class="config-name">三红</span><label class="config-cell">数量<input data-count="三红" type="number" min="0" max="999" value="4"></label><label class="config-cell">金额或奖品<input data-reward="三红" maxlength="30" placeholder="如：50 元红包"></label></div>
        <div class="config-row"><span class="config-name">四进</span><label class="config-cell">数量<input data-count="四进" type="number" min="0" max="999" value="8"></label><label class="config-cell">金额或奖品<input data-reward="四进" maxlength="30" placeholder="如：月饼礼盒"></label></div>
        <div class="config-row"><span class="config-name">对堂</span><label class="config-cell">数量<input data-count="对堂" type="number" min="0" max="999" value="2"></label><label class="config-cell">金额或奖品<input data-reward="对堂" maxlength="30" placeholder="如：100 元红包"></label></div>
        <div class="config-row"><span class="config-name">状元</span><label class="config-cell">数量<input data-count="状元" type="number" min="0" max="999" value="1"></label><label class="config-cell">金额或奖品<input data-reward="状元" maxlength="30" placeholder="如：状元大奖"></label></div>
      </div></details>
      <div class="actions"><button id="create" class="primary">创建房间</button><button id="join" class="secondary">加入好友房间</button></div>
      <div class="note">免费点对点连接；房主离开后本局结束。建议使用微信内置浏览器或最新版 Chrome / Safari。</div>
    </section>
    <section id="game" class="game">
      <aside class="card side"><div class="roomline"><div><div class="you">房间号</div><div id="roomCode" class="code">——</div></div><button id="share" class="secondary tiny">复制邀请</button></div><div id="players" class="players"></div><div class="prize-board"><h3>剩余奖项</h3><div id="prizes" class="prizes"></div></div></aside>
      <main class="card main"><div class="turn"><h2 id="turnTitle">等待好友加入</h2><p id="turnHint">房主可以先掷，好友随后加入</p></div><div id="bowl" class="bowl"><div id="dice" class="dicegrid"></div></div><div class="rollwrap"><div id="result" class="result"></div><button id="roll" class="roll" disabled>轮到你时可掷骰子</button></div></main>
      <section class="awards-panel"><h3 class="panel-title">实时奖励记录</h3><div id="awardBoard" class="award-board"></div></section>
      <section class="history"><h3>本局记录</h3><div id="log" class="log"><span class="you">还没有人掷骰子</span></div></section>
      <section id="ceremony" class="ceremony"><h2>🏆 本局颁奖清单</h2><p>所有奖项已经博完，恭喜各位！</p><div id="ceremonyList" class="ceremony-list"></div></section>
    </section>
  </div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
const prizeNames=['一秀','二举','三红','四进','对堂','状元'];
const blankWins=()=>Object.fromEntries(prizeNames.map(n=>[n,0]));
const defaultPrizes=()=>Object.fromEntries([['一秀',32],['二举',16],['三红',4],['四进',8],['对堂',2],['状元',1]].map(([n,q])=>[n,{total:q,remaining:q,reward:''}]));
const SESSION_KEY='bobing-last-session-v4';
let peer,hostConn,isHost=false,myId='',currentRoom='',state={players:[],turn:0,history:[],dice:[1,1,1,1,1,1],prizes:defaultPrizes(),gameOver:false},conns=[],connPlayers=new Map();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function cleanName(){return ($('#name').value.trim()||'好运玩家').slice(0,12)}
function token(){return crypto.randomUUID?.()||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`}
function loadSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY));return s&&Date.now()-s.updatedAt<7*864e5?s:null}catch{return null}}
function saveSession(data){try{localStorage.setItem(SESSION_KEY,JSON.stringify({...data,version:4,updatedAt:Date.now()}))}catch{}}
function saveHostSession(){if(isHost&&currentRoom)saveSession({role:'host',room:currentRoom,playerKey:myId,name:state.players.find(p=>p.id===myId)?.name||'房主',state})}
function award(ds){const c=Array(7).fill(0);ds.forEach(x=>c[x]++);if(c[4]===6)return{label:'六杯红 · 状元',category:'状元'};if(c[1]===6)return{label:'遍地锦 · 状元',category:'状元'};if(c.some(x=>x===6))return{label:'六勃黑 · 状元',category:'状元'};if(c[4]===5)return{label:'五红 · 状元',category:'状元'};if(c.some(x=>x===5))return{label:'五子 · 状元',category:'状元'};if(c[4]===4&&c[1]===2)return{label:'状元插金花',category:'状元'};if(c[4]===4)return{label:'四红 · 状元',category:'状元'};if(c.slice(1).every(x=>x===1))return{label:'对堂',category:'对堂'};if(c.some(x=>x===4))return{label:'四进',category:'四进'};if(c[4]===3)return{label:'三红',category:'三红'};if(c[4]===2)return{label:'二举',category:'二举'};if(c[4]===1)return{label:'一秀',category:'一秀'};return{label:'未中奖',category:null}}
function code(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function showGame(room){$('#start').style.display='none';$('#game').style.display='grid';$('#roomCode').textContent=room;$('#dice').innerHTML=state.dice.map(n=>`<div class="die">${faces[n-1]}</div>`).join('');render()}
function publicState(){return{...state}}
function broadcast(){conns=conns.filter(c=>c.open);conns.forEach(c=>c.send({type:'state',state:publicState()}));saveHostSession();render()}
function winsHtml(p){const won=prizeNames.filter(n=>(p.wins?.[n]||0)>0);return won.length?won.map(n=>`<span class="win-chip">${n} × ${p.wins[n]}</span>`).join(''):'<span class="you">尚未获得奖项</span>'}
function render(){const current=state.players[state.turn];$('#players').innerHTML=state.players.map((p,i)=>`<div class="player ${i===state.turn&&!state.gameOver&&p.active!==false?'active':''}"><span class="avatar">${p.name[0]}</span><div><div class="pname">${esc(p.name)}</div><div class="you">${p.id===myId?'我 · ':''}${p.active===false?'已离线':i===state.turn&&!state.gameOver?'本回合':'等待中'}</div></div></div>`).join('');$('#prizes').innerHTML=prizeNames.map(n=>{const p=state.prizes[n];return`<div class="prize ${p.remaining===0?'empty':''}"><span>${n}</span><b>${p.remaining}</b>${p.reward?`<small>${esc(p.reward)}</small>`:''}</div>`}).join('');$('#awardBoard').innerHTML=state.players.map(p=>`<article class="award-person"><div class="award-person-head"><b>${esc(p.name)}</b>${p.active===false?'<span class="offline">已离线</span>':''}</div><div class="win-chips">${winsHtml(p)}</div></article>`).join('');$('#ceremony').classList.toggle('show',state.gameOver);$('#ceremonyList').innerHTML=state.players.map(p=>{const won=prizeNames.filter(n=>(p.wins?.[n]||0)>0);return`<article class="ceremony-person"><h3>${esc(p.name)}</h3>${won.length?`<ul>${won.map(n=>`<li>${n} × ${p.wins[n]}${state.prizes[n].reward?`：${esc(state.prizes[n].reward)}`:''}</li>`).join('')}</ul>`:'<div class="none">本局未获得奖项</div>'}</article>`}).join('');$('#turnTitle').textContent=state.gameOver?'本局奖项已全部博完':current?`轮到 ${current.name}`:'等待玩家';const mine=!state.gameOver&&current&&current.id===myId;$('#turnHint').textContent=state.gameOver?'颁奖清单已经生成，可按清单发放奖品':mine?'点击下方按钮，掷出六颗骰子':'结果会自动同步到每个人';$('#turnHint').classList.toggle('gameover',state.gameOver);$('#roll').disabled=!mine;$('#roll').textContent=state.gameOver?'本局已结束':mine?'掷骰子':'等待好友掷骰子';$('#dice').innerHTML=state.dice.map(n=>`<div class="die">${faces[n-1]}</div>`).join('');const last=state.history.at(-1);$('#result').textContent=last?last.award:'';$('#log').innerHTML=state.history.length?state.history.slice().reverse().map(h=>`<div class="logitem"><b>${esc(h.name)}</b> · ${h.dice.join(' ')} · ${h.award}</div>`).join(''):'<span class="you">还没有人掷骰子</span>';$('#netStatus').textContent=peer&&!peer.disconnected?'已连接 · 点对点联机':'正在连接'}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nextActiveIndex(from){for(let step=1;step<=state.players.length;step++){const i=(from+step)%state.players.length;if(state.players[i]?.active!==false)return i}return from}
function doRoll(playerId){if(!isHost||state.gameOver||state.players[state.turn]?.id!==playerId)return;$('#bowl').classList.add('rolling');setTimeout(()=>{const ds=Array.from({length:6},()=>1+Math.floor(Math.random()*6));const p=state.players[state.turn],won=award(ds);let display=won.label;if(won.category){const prize=state.prizes[won.category];if(prize.remaining>0){prize.remaining--;p.wins[won.category]=(p.wins[won.category]||0)+1;display+=prize.reward?` · ${prize.reward}`:'';display+=` · 剩 ${prize.remaining} 份`}else display+=' · 已领完'}state.dice=ds;state.history.push({name:p.name,dice:ds,award:display,category:won.category});state.gameOver=prizeNames.every(n=>state.prizes[n].remaining===0);if(!state.gameOver)state.turn=nextActiveIndex(state.turn);$('#bowl').classList.remove('rolling');broadcast()},700)}
function wireHost(c){conns.push(c);c.on('data',m=>{if(m.type==='join'){const key=String(m.playerKey||c.peer),old=state.players.find(p=>p.id===key);connPlayers.set(c.peer,key);if(old){old.active=true;old.name=String(m.name||old.name).slice(0,12)}else state.players.push({id:key,name:String(m.name||'好友').slice(0,12),wins:blankWins(),active:true});broadcast()}if(m.type==='roll')doRoll(connPlayers.get(c.peer))});c.on('close',()=>{const key=connPlayers.get(c.peer),p=state.players.find(p=>p.id===key);if(p)p.active=false;if(state.players[state.turn]?.id===key)state.turn=nextActiveIndex(state.turn);connPlayers.delete(c.peer);broadcast()})}
function launchHost(room,restored=false,attempt=0){currentRoom=room;isHost=true;peer=new Peer('bobing-'+room,{debug:0});peer.on('open',()=>{history.replaceState(null,'',location.pathname+location.search+'#'+room);showGame(room);saveHostSession();peer.on('connection',wireHost);if(restored)toast('已恢复上一次对局')});peer.on('error',e=>{if(e?.type==='unavailable-id'&&attempt<4){peer.destroy();$('#netStatus').textContent='正在恢复房间';setTimeout(()=>launchHost(room,restored,attempt+1),1200)}else toast(e?.type==='unavailable-id'?'旧房间仍在线，请关闭旧页面后重试':'连接失败，请刷新后重试')})}
function startHost(){const n=cleanName(),room=code();state.prizes=Object.fromEntries(prizeNames.map(name=>{const countEl=document.querySelector(`[data-count="${name}"]`),rewardEl=document.querySelector(`[data-reward="${name}"]`),total=Math.max(0,Math.min(999,Number.parseInt(countEl.value)||0));return[name,{total,remaining:total,reward:rewardEl.value.trim().slice(0,30)}]}));if(prizeNames.every(k=>state.prizes[k].total===0)){toast('请至少设置一个奖项');return}state.gameOver=false;state.history=[];myId=token();state.players=[{id:myId,name:n,wins:blankWins(),active:true}];launchHost(room)}
function restoreHost(s){state=s.state;currentRoom=s.room;myId=s.playerKey;state.players.forEach(p=>{p.active=p.id===myId;p.wins={...blankWins(),...(p.wins||{})}});const host=state.players.find(p=>p.id===myId);if(host)host.active=true;else state.players.unshift({id:myId,name:s.name||'房主',wins:blankWins(),active:true});launchHost(s.room,true)}
function connect(room,resume=null){const n=(resume?.name||cleanName()).slice(0,12),playerKey=resume?.playerKey||token();currentRoom=room;myId=playerKey;isHost=false;peer=new Peer({debug:0});peer.on('open',()=>{hostConn=peer.connect('bobing-'+room,{reliable:true});hostConn.on('open',()=>{hostConn.send({type:'join',name:n,playerKey});saveSession({role:'guest',room,playerKey,name:n});history.replaceState(null,'',location.pathname+location.search+'#'+room);showGame(room);if(resume)toast('已重新加入上一次对局')});hostConn.on('data',m=>{if(m.type==='state'){state=m.state;render()}});hostConn.on('close',()=>{$('#netStatus').textContent='与房主断开';$('#roll').disabled=true;toast('连接中断，可重新打开页面返回本局')});setTimeout(()=>{if(!hostConn.open)toast('暂时找不到房间，请确认房主已经恢复对局')},7000)});peer.on('error',()=>toast('连接失败，请检查房间号'))}
$('#create').onclick=startHost;$('#join').onclick=()=>{const f=$('#joinField');if(f.style.display==='none'){f.style.display='grid';$('#join').textContent='确认加入';return}const r=$('#room').value.trim().toUpperCase();if(r)connect(r,lastSession?.room===r&&lastSession.role==='guest'?lastSession:null)};$('#roll').onclick=()=>isHost?doRoll(myId):hostConn?.send({type:'roll'});$('#share').onclick=async()=>{const url=location.origin+location.pathname+'#'+$('#roomCode').textContent;const text=`来和我一起博饼！打开链接加入房间：${url}`;try{if(navigator.share)await navigator.share({title:'月下博饼',text,url});else{await navigator.clipboard.writeText(text);toast('邀请链接已复制')}}catch{}}
const lastSession=loadSession(),hash=location.hash.slice(1).toUpperCase();if(lastSession){$('#resumeBox').classList.add('show');$('#resumeText').textContent=`${lastSession.role==='host'?'房主':'玩家'} · 房间 ${lastSession.room}`;$('#name').value=lastSession.name||'';$('#resumeBtn').onclick=()=>lastSession.role==='host'?restoreHost(lastSession):connect(lastSession.room,lastSession)}if(hash){$('#joinField').style.display='grid';$('#prizeConfig').style.display='none';$('#room').value=hash;$('#join').textContent=lastSession?.room===hash?'重新加入上局':'加入这个房间'}
if(document.modelContext?.registerTool)document.modelContext.registerTool({name:'roll_dice',title:'掷骰子',description:'在轮到当前玩家时掷出六颗骰子。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async()=>{if($('#roll').disabled)throw new Error('现在还没轮到你');$('#roll').click();return{status:'rolling'}}}).catch(()=>{});
</script>
</body></html>
